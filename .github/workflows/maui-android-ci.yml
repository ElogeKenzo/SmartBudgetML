# ==============================================================================
# SmartBudget ML v2.0 — CI/CD Pipeline (.NET 10 LTS)
# Triggers on push (develop, main, feature/**), pull_request, and workflow_dispatch
# Jobs:
#   1. test          — xUnit suite + code coverage (>= 70% threshold on Services/)
#   2. analyze       — Format check, vulnerable & outdated NuGet package audit
#   3. build-android — Release APK & Play Store AAB with exact size reporting
#   4. emulator-test — Android Emulator (Redmi 3 GB RAM profile) smoke & perf test
# ==============================================================================

name: MAUI Android CI

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'SmartBudgetML/SmartBudgetML.csproj'
  TEST_PROJECT_PATH: 'SmartBudgetML.Tests/SmartBudgetML.Tests.csproj'
  APP_PACKAGE_ID: 'com.smartbudgetml.app'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Run Unit Tests & Coverage Report (>= 70% target on Services/)
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore test dependencies
        run: dotnet restore ${{ env.TEST_PROJECT_PATH }}

      - name: 🧪 Run xUnit tests with XPlat Code Coverage
        run: >
          dotnet test ${{ env.TEST_PROJECT_PATH }}
          --no-restore
          -c Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: 📈 Generate Coverage Summary in Step Summary
        if: always()
        run: |
          echo "## 🧪 Résumé des Tests Unitaires (.NET 10)" >> $GITHUB_STEP_SUMMARY
          dotnet tool install -g dotnet-reportgenerator-globaltool || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          if command -v reportgenerator &> /dev/null && compgen -G "./TestResults/**/coverage.cobertura.xml" > /dev/null; then
            reportgenerator -reports:"./TestResults/**/coverage.cobertura.xml" -targetdir:"./CoverageReport" -reporttypes:"MarkdownSummaryGithub;HtmlInline" -filefilters:"+*Services*"
            cat ./CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          else
            echo "Tests exécutés avec succès (voir l'artefact test-results)." >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📊 Upload test & coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-results
          path: |
            ./TestResults/**
            ./CoverageReport/**

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Static Analysis & Dependency Security Audit
  # ────────────────────────────────────────────────────────────────────────────
  analyze:
    name: 🔍 Code Quality & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore test project
        run: dotnet restore ${{ env.TEST_PROJECT_PATH }}

      - name: 📐 Verify formatting & style analyzers
        run: dotnet format ${{ env.TEST_PROJECT_PATH }} --verify-no-changes --no-restore || echo "Format warnings logged"

      - name: 🛡️ Audit NuGet packages for known vulnerabilities
        run: |
          echo "## 🛡️ Audit des Dépendances NuGet" >> $GITHUB_STEP_SUMMARY
          dotnet list ${{ env.TEST_PROJECT_PATH }} package --vulnerable --include-transitive | tee -a $GITHUB_STEP_SUMMARY
          dotnet list ${{ env.TEST_PROJECT_PATH }} package --outdated | tee -a $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Build Android Release APK & Play Store AAB
  # ────────────────────────────────────────────────────────────────────────────
  build-android:
    name: 🤖 Build Android APK & AAB
    runs-on: windows-latest
    needs: [test, analyze]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📱 Install MAUI Android Workload
        run: dotnet workload install maui-android

      - name: 📦 Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: 🏗️ Publish Android APK (Release)
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -f net10.0-android
          -p:AndroidPackageFormat=apk
          -o ./artifacts/android-apk

      - name: 🏗️ Publish Android App Bundle AAB (Play Store Release)
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -f net10.0-android
          -p:AndroidPackageFormat=aab
          -o ./artifacts/android-aab

      - name: 📏 Report APK & AAB Sizes in Step Summary
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## 📦 Tailles des Livrables Android (Release)"
          Get-ChildItem -Path ./artifacts -Recurse -Include *.apk,*.aab | ForEach-Object {
            $sizeMb = [math]::Round($_.Length / 1MB, 2)
            $sizeKb = [math]::Round($_.Length / 1KB, 0)
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **$($_.Name)** : `$sizeMb Mo` (`$sizeKb Ko`)"
          }

      - name: 📤 Upload Android APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartBudgetML-Android-Packages
          path: |
            ./artifacts/android-apk/**/*-Signed.apk
            ./artifacts/android-aab/**/*-Signed.aab
          retention-days: 14
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # Job 4: Android Emulator Smoke & Performance Test (Redmi 3 GB RAM Profile)
  # ────────────────────────────────────────────────────────────────────────────
  emulator-test:
    name: 📱 Android Emulator Smoke Test (Redmi 3GB Profile)
    runs-on: ubuntu-latest
    needs: build-android

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Built Android APK
        uses: actions/download-artifact@v4
        with:
          name: SmartBudgetML-Android-Packages
          path: ./apk-artifact

      - name: 🚀 Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 📱 Run Smoke Test on Android Emulator (API 33, 3072 MB RAM, 720x1600)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          heap-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 720x1600
          disable-animations: true
          script: |
            APK_FILE=$(find ./apk-artifact -name "*-Signed.apk" | head -n 1)
            echo "Installing $APK_FILE..."
            adb install -r "$APK_FILE"

            echo "Measuring cold start time via am start -W..."
            START_OUT=$(adb shell am start -W -n com.smartbudgetml.app/crc64e53f2f5920229880.MainActivity || adb shell monkey -p com.smartbudgetml.app -c android.intent.category.LAUNCHER 1)
            echo "$START_OUT"

            sleep 5
            echo "Checking process & memory footprint (PSS)..."
            PID=$(adb shell pidof com.smartbudgetml.app)
            if [ -z "$PID" ]; then
              echo "ERROR: App process com.smartbudgetml.app is not running!"
              adb logcat -d -t 200
              exit 1
            fi

            MEM_OUT=$(adb shell dumpsys meminfo com.smartbudgetml.app | grep -E "TOTAL PSS|TOTAL:")
            echo "$MEM_OUT"

            {
              echo "## 📱 Résultats du Test de Fumée Émulateur (Profil Redmi 3 Go RAM)"
              echo "- **PID actif** : \`$PID\`"
              echo "- **Sortie démarrage à froid** :"
              echo "\`\`\`"
              echo "$START_OUT"
              echo "\`\`\`"
              echo "- **Empreinte mémoire (`dumpsys meminfo`)** :"
              echo "\`\`\`"
              echo "$MEM_OUT"
              echo "\`\`\`"
            } >> $GITHUB_STEP_SUMMARY
